secrets:
  # source map 上傳用的 GlitchTip API token（scope 只有 project:read /
  # project:releases / org:read）。未提交，權限 600。
  sentry_token:
    file: ./.env.sourcemaps.token

volumes:
  backend-db-data: # DB 檔的 docker volume（backend-rs + db-backup 共用）

networks:
  # 錯誤上報用（見 ~/Server/glitchtip/）。刻意走內網而不是公網 DSN：
  # 公網那條要繞出去經 nginx 再回來，而 nginx 掛掉正是最需要收到錯誤的時候。
  # 建立方式：docker network create observability
  observability:
    external: true

# 啟用 Docker BuildKit 的 Bake 功能以提升建置效能
# 在您的 shell 環境中設定此變數: export COMPOSE_BAKE=true (Linux/macOS) 或 $env:COMPOSE_BAKE="true" (Windows PowerShell)

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 錯誤上報。DSN 裡那把 key 是假的（真的在 .env.backend，後端轉發時換上）。
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_RELEASE=${VITE_RELEASE:-}
      secrets:
        # source map 上傳用。走 secret 而不是 ARG——ARG 會留在映像歷史裡。
        # 檔案不存在時 compose 會報錯，所以 .env.sourcemaps 是必要的
        #（沒有它就等於不打算做錯誤追蹤，那應該是個明確的決定而不是意外）。
        - sentry_token
    container_name: personal-website-frontend # 指定容器名稱
    environment:
      - TZ=Asia/Taipei
      - BACKEND_URL=http://backend-rs:3002
      - SITE_URL=https://koimsurai.com
      # 發文/改文後 backend-rs 會打 /_revalidate 清 ISR 快取，不必等 TTL（文章頁 1h）。
      # 密鑰放未提交的 ./.env（compose 會自動載入做 ${} 替換）；沒設 = 端點回 404、功能不啟用。
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    ports:
      # 【修改點】明確指定只綁定到 127.0.0.1
      - "127.0.0.1:13588:13579"
    restart: unless-stopped # 設定容器重啟策略
    healthcheck:
      # slim image 沒有 curl/wget → 用 node 內建 fetch 打首頁
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13579/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-rs:
        condition: service_healthy

  backend-rs:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: personal-website-backend-rs
    environment:
      - TZ=Asia/Taipei
      - GALLERY_SOURCE_PATH=/usr/src/app/storage/Blog_Source
      - DATABASE_URL=sqlite:///usr/src/app/db/db.sqlite
      - BIND_ADDR=0.0.0.0:3002
      - RUST_LOG=info,koimsurai_web_backend=info
      # 文章內容變更後通知前端清 ISR 快取（fire-and-forget，失敗只會 warn，最壞就是等 TTL）。
      # 13579 = 前端容器內部 port（Dockerfile ENV PORT=13579）。兩邊密鑰必須相同。
      - FRONTEND_REVALIDATE_URL=http://frontend:13579/_revalidate
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      # workers：Express 退役後 Rust 為 history 表唯一寫者
      #
      # ⚠️ Trakt 相關的程式碼已於 2026-08-02 整個移除（約 580 行），連同 ENABLE_TRAKT_SYNC。
      # Trakt 在 2026-07-30 把「建立 API application」改成 VIP 專屬（trakt/trakt-web PR #3057，
      # i18n 字串就是 "Creating new apps requires Trakt VIP"），且未經預告刪除了免費帳號的
      # 既有 app——refresh 回 400 invalid_grant "session not found"、device/code 回 401
      # invalid_client "client not found"，app 在 Trakt 那端已不存在，重新授權也沒用。
      # 同一時間大量使用者回報相同狀況（forums.trakt.tv/t/119235、trakt-web issue #3061）。
      #
      # 之前只是把 flag 關掉、程式碼留著，但那沒有把成本歸零：/api/watch/now 的**即時輪詢**
      # 沒有受這個 flag 管，每 25 秒仍會為一支必定失敗的呼叫付一次連線成本（實測正式站
      # 首發 513ms，移除後 1–2 ms）。既有的 155 筆 trakt 紀錄保留不動
      # （film_history 4 筆到 2026-07-25、tv_history 151 筆）。
      # 要復原的話 git 裡找得回來，但更可能的路是繼續用 Simkl。
      - ENABLE_BAHAMUT_SYNC=1
      # Simkl 同步（Trakt 的替代）。每次只打一個很輕的 /sync/activities，時間戳沒變就結束；
      # 有變才用 date_from 拉增量。Simkl 官方明文要求這個做法，無條件全量輪詢會被停權。
      #
      # ⚠️ SIMKL_CLIENT_ID / SIMKL_ACCESS_TOKEN 走下面的 env_file（./.env.backend），
      # 不要在這裡寫 `- SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID:-}`——compose 的 `environment`
      # 優先於 `env_file`，而 `${VAR:-}` 讀的是 compose 自己的 .env（那裡沒有這些鍵），
      # 結果會用空字串蓋掉 env_file 裡的真值。踩過一次：worker 起來直接說「缺 CLIENT_ID」。
      - ENABLE_SIMKL_SYNC=1
    volumes:
      - backend-db-data:/usr/src/app/db
      - /mnt/hdd16tb_01/Blog/uploads:/usr/src/app/storage/uploads
      - /mnt/hdd16tb_01/nas-storage/Blog_Source:/usr/src/app/storage/Blog_Source:ro
      - /mnt/hdd16tb_01/nas-storage/gallery:/usr/src/app/storage/gallery
    env_file:
      - ./.env.backend
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      # observability = 連得到 glitchtip 容器（SENTRY_DSN 指的是 http://glitchtip:8000）
      - default
      - observability
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # SQLite 每日線上備份 → HDD（VACUUM INTO 快照 + gzip + 依天數輪替）。
  # alpine 開機裝 sqlite（唯一執行期依賴），跑 scripts/backup-db.sh。
  db-backup:
    image: alpine:3.20
    container_name: personal-website-db-backup
    environment:
      - TZ=Asia/Taipei
      - BACKUP_INTERVAL_SECONDS=86400
      - BACKUP_KEEP_DAYS=14
    volumes:
      - backend-db-data:/db # 與 backend-rs 共用（WAL 支援多程序讀）
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - /mnt/hdd16tb_01/Blog/db-backups:/backups
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null && exec /bin/sh /backup-db.sh"]
    restart: unless-stopped
