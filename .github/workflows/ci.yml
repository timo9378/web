name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小權限：所有 job 只需讀 repo（zizmor excessive-permissions）。
permissions:
  contents: read

# 同分支/PR 有新 push 就取消進行中的舊 run，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# action 一律釘 commit SHA：tag 可被移動，上游 repo 被入侵即等於在 CI 執行任意程式碼
# （zizmor unpinned-uses）。版本靠 .github/dependabot.yml 的 github-actions 生態自動更新。
# checkout 一律 persist-credentials: false：預設會把 git 憑證留在工作區（zizmor artipacked）。

jobs:
  frontend:
    name: Frontend · tsc + oxlint + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: mcp-server typecheck
        run: pnpm --filter @koimsurai/mcp-server typecheck
      # server/routes 與 scripts/ 不在根 tsconfig 的 include（只收 src），過去完全沒被檢查。
      # 各自有 tsconfig.json（檔名固定：eslint 的 projectService 只認這個名字）。
      - name: server routes typecheck
        run: pnpm typecheck:server
      - name: scripts typecheck
        run: pnpm typecheck:scripts
      # oxlint 取代 eslint（設定見 .oxlintrc.json，182 條規則自 eslint --print-config 對映而來；
      # @eslint-react 整包經 jsPlugins 載入，命名空間保持 @eslint-react 讓既有 eslint-disable 註解續效）。
      # --max-warnings 0：存量已全數清完（379 → 0），從此新增任何警告都直接擋下。
      - name: oxlint (src, type-aware)
        run: pnpm exec oxlint --type-aware --tsconfig=tsconfig.json src --max-warnings 0
      # scripts/server/packages 過去完全沒被 lint（CI 只跑 eslint src）。
      # 不帶 --type-aware：它們不在根 tsconfig 的 include 裡，型別會全解析成 any，
      # 讓 no-unsafe-* 系列誤報 46 筆。型別由各自的 typecheck:* 步驟負責。
      # --max-warnings 0：這三個目錄目前乾淨，直接鎖死，不留讓它從 0 無聲長大的空間。
      - name: oxlint (scripts + server + packages)
        run: pnpm exec oxlint scripts server packages --max-warnings 0
      - name: vitest
        run: pnpm test
      # 真正的建置驗證——tsc/lint 過不代表 Nitro/Vite build 不會炸
      - name: build (vite + nitro)
        run: pnpm build

  backend:
    name: Backend · clippy + test + specta drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      # workspaces 必須指向真正的 workspace root。這個 repo 的 Cargo.toml 在根目錄
      # （members = ["backend"]），所以 target/ 也在根目錄——backend/target 根本不存在。
      # 原本寫 backend 導致 rust-cache 找不到 target/，只快取了 ~/.cargo 的 registry。
      #
      # 證據（2026-07-28）：GitHub 上的快取 76 MB，而同一份冷編譯在本機是 3.5 GB
      # → 編譯產物一個都沒進去，每次 CI 都在從零重編 453 個依賴。
      # 這也解釋了為什麼還原只要 1–3 秒、每步卻要 100 秒以上，以及為什麼上一次
      # 只換 prefix-key（382s → 350s）幾乎沒用：陳舊的不是內容，是根本沒存。
      #
      # 本機 16 核冷編譯 268 CPU 秒：tikv-jemalloc-sys 27.3s、libwebp-sys 13.7s、
      # libsqlite3-sys 9.0s 都是 C 建置，自有 crate 只佔 7.2%（依賴全熱時 clippy 只要 5.3s）。
      #
      # 判讀：改完的「第一次」run 會慢（要建立並上傳 GB 級快取），第二次才是真實水準。
      # 快取大小若沒從 76 MB 跳到 GB 級，代表這個假設也錯了。
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-llvm-cov
      # 格式守門（設定見 backend/rustfmt.toml：max_width 110 + 緊湊啟發式，貼近既有風格）
      - name: cargo fmt --check
        run: cargo fmt --check
      # --locked：CI 必須測「commit 進來的那組版本」，不允許靜默更新 Cargo.lock
      - name: clippy (-D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      # 測試 + 覆蓋率一次跑完（llvm-cov 會帶 instrumentation 重編，不另外跑 nextest 免得編兩次）。
      # 用 region 而非 line 當門檻：line coverage 會被「格式化」影響——導入 rustfmt 時
      # 測試一個沒少，line 卻從 17.24% 掉到 14.14%（多行 if/else 被收成單行），
      # 而同一次 region 只從 12.44% 動到 12.45%。region 對應實際分支，不隨排版漂移。
      # 現況 region 12.45%，門檻設 12 只擋退步。0% 的多是外部 API 整合
      # （Trakt/動畫瘋/Spotify/OAuth），要 mock 外部服務才測得動，刻意不追高。
      - name: test + coverage (llvm-cov + nextest)
        run: cargo llvm-cov nextest --locked --fail-under-regions 12
      # 契約守門：Rust struct 改了但沒重跑 export_types → 生成型別與 committed 不一致 → 擋下
      - name: specta types up-to-date
        run: |
          cargo run --locked --bin export_types
          cd ..
          git diff --exit-code packages/api-types/index.ts
      # Rust 依賴漏洞掃描（Cargo.lock 在 workspace 根；豁免清單見 .cargo/audit.toml）
      - name: cargo audit
        working-directory: .
        run: cargo audit

  # 前後端「合起來會不會動」的守門。前面兩個 job 各自都綠，卻擋不到：
  #   - 後端改了回應形狀、前端還照舊讀（這批 specta 化就改過 steam/github/wakatime 的形狀）
  #   - 值沒處理好漏到畫面上（Invalid Date、f/f/1.4、132 mmmm 三個都是手動開瀏覽器才發現的）
  #   - 該掛守衛的端點沒掛
  # 跑的是真的 stack：後端 binary（temp SQLite + seed）＋ nitro server ＋ 一層 /api 代理
  # （生產是 nginx 做這件事）。細節見 tests/e2e/stack.mjs。
  e2e:
    name: E2E · 全站煙霧 + API 契約 + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # 與 backend job 共用同一份快取（workspace root 在根目錄，見上面那段說明）
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
      - run: pnpm install --frozen-lockfile
      # 只裝 chromium：三家瀏覽器各裝一次要 3 分鐘，而這裡測的是資料流不是渲染差異
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: build backend
        run: cargo build --locked --bin koimsurai-web-backend
      - name: build frontend
        run: pnpm build
      - name: playwright
        run: pnpm e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 從 OpenAPI spec 自動生成 API 測試。跟 e2e 分開跑，因為它會對同一個 DB 打上千個
  # 請求，要自己的拋棄式 DB；而且它不需要前端，只起後端就好。
  #
  # 為什麼值得：spec 有 123 個 operation，輸入是 schemathesis 生的而不是我們想到的。
  # 第一次跑就撞出 `GET /api/films/recent?limit=abc` → 500（三支 watch 端點都中，
  # 公開免認證）。設定與已知例外見根目錄的 schemathesis.toml。
  api-fuzz:
    name: API · Schemathesis（從 OpenAPI 自動生成）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - run: pnpm install --frozen-lockfile
      - name: build backend
        run: cargo build --locked --bin koimsurai-web-backend
      # stack.mjs 會等前端的 .output 存在；這裡只要後端，所以直接起 binary
      - name: 起後端（temp SQLite + migrations + seed）
        run: |
          node -e "
            const { spawn } = require('node:child_process');
            const { seed } = require('./tests/e2e/seed.mjs');
            const db = '/tmp/koimsurai-fuzz.db';
            const p = spawn('./target/debug/koimsurai-web-backend', [], {
              env: { ...process.env, DATABASE_URL: 'sqlite://' + db + '?mode=rwc',
                     BIND_ADDR: '127.0.0.1:13999', JWT_SECRET: 'fuzz',
                     ADMIN_USERNAME: 'nope', ADMIN_PASSWORD: 'nope', RUST_LOG: 'warn' },
              detached: true, stdio: 'ignore' });
            p.unref();
            (async () => {
              for (let i = 0; i < 120; i++) {
                try { if ((await fetch('http://127.0.0.1:13999/api/health')).ok) break; } catch {}
                await new Promise(r => setTimeout(r, 500));
              }
              seed(db);
              console.log('後端就緒');
            })();
          "
      - name: schemathesis
        run: uvx schemathesis run http://127.0.0.1:13999/api/openapi.json -w 4 --report-junit-path st.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6
        if: failure()
        with:
          name: schemathesis-report
          path: st.xml
          retention-days: 7

  # 部署路徑守門：CI 過但 docker build 炸過（js-yaml + 未釘 pnpm 那次），
  # 因為前端 job 只跑 vite build、從不碰 Dockerfile。這個 job 補上那個缺口。
  docker:
    name: Docker · frontend + backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # workflow 自身的守門：actionlint 管正確性、zizmor 管安全（template injection、
  # 過寬權限、未釘 action、憑證外洩）。CI 自己也是攻擊面。
  workflows:
    name: Workflows · actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # actionlint 不在 taiki-e/install-action 的清單裡，用維護中的 wrapper action。
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: zizmor
      - name: zizmor
        run: zizmor .github/workflows/
