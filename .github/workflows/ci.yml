name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 內容檢查（content job）用的：文章在 DB 裡不在 repo，PR 改的是程式碼不是內容，
  # 所以那一項不擋 PR，改成每天跑一次 + 需要時手動觸發。
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Taipei
  workflow_dispatch:

# 最小權限：所有 job 只需讀 repo（zizmor excessive-permissions）。
permissions:
  contents: read

# 同分支/PR 有新 push 就取消進行中的舊 run，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# action 一律釘 commit SHA：tag 可被移動，上游 repo 被入侵即等於在 CI 執行任意程式碼
# （zizmor unpinned-uses）。版本靠 .github/dependabot.yml 的 github-actions 生態自動更新。
# checkout 一律 persist-credentials: false：預設會把 git 憑證留在工作區（zizmor artipacked）。

jobs:
  frontend:
    name: Frontend · tsc + oxlint + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: mcp-server typecheck
        run: pnpm --filter @koimsurai/mcp-server typecheck
      # server/routes 與 scripts/ 不在根 tsconfig 的 include（只收 src），過去完全沒被檢查。
      # 各自有 tsconfig.json（檔名固定：eslint 的 projectService 只認這個名字）。
      - name: server routes typecheck
        run: pnpm typecheck:server
      - name: scripts typecheck
        run: pnpm typecheck:scripts
      # oxlint 取代 eslint（設定見 .oxlintrc.json，182 條規則自 eslint --print-config 對映而來；
      # @eslint-react 整包經 jsPlugins 載入，命名空間保持 @eslint-react 讓既有 eslint-disable 註解續效）。
      # --max-warnings 0：存量已全數清完（379 → 0），從此新增任何警告都直接擋下。
      - name: oxlint (src, type-aware)
        run: pnpm exec oxlint --type-aware --tsconfig=tsconfig.json src --max-warnings 0
      # scripts/server/packages 過去完全沒被 lint（CI 只跑 eslint src）。
      # 不帶 --type-aware：它們不在根 tsconfig 的 include 裡，型別會全解析成 any，
      # 讓 no-unsafe-* 系列誤報 46 筆。型別由各自的 typecheck:* 步驟負責。
      # --max-warnings 0：這三個目錄目前乾淨，直接鎖死，不留讓它從 0 無聲長大的空間。
      - name: oxlint (scripts + server + packages)
        run: pnpm exec oxlint scripts server packages --max-warnings 0
      # 未使用的檔案／相依。設定見 knip.json。
      #
      # ⚠️ 只 gate files + dependencies 這幾類，因為它們現在是零；exports 類還有
      # 24 個未使用匯出 + 11 個未使用型別沒清。那是另一批工作（要逐個判斷是「該刪」
      # 還是「刻意留的公開介面」），清完再把 --include 拿掉。
      # 這裡刻意不是用 ignore 把它們藏起來——藏起來就沒有人會回來清。
      - name: knip（未使用的檔案與相依）
        run: pnpm exec knip --no-progress --include files,dependencies,unlisted,unresolved,binaries
      - name: vitest
        run: pnpm test
      # 真正的建置驗證——tsc/lint 過不代表 Nitro/Vite build 不會炸
      - name: build (vite + nitro)
        run: pnpm build

  backend:
    name: Backend · clippy + test + specta drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      # workspaces 必須指向真正的 workspace root。這個 repo 的 Cargo.toml 在根目錄
      # （members = ["backend"]），所以 target/ 也在根目錄——backend/target 根本不存在。
      # 原本寫 backend 導致 rust-cache 找不到 target/，只快取了 ~/.cargo 的 registry。
      #
      # 證據（2026-07-28）：GitHub 上的快取 76 MB，而同一份冷編譯在本機是 3.5 GB
      # → 編譯產物一個都沒進去，每次 CI 都在從零重編 453 個依賴。
      # 這也解釋了為什麼還原只要 1–3 秒、每步卻要 100 秒以上，以及為什麼上一次
      # 只換 prefix-key（382s → 350s）幾乎沒用：陳舊的不是內容，是根本沒存。
      #
      # 本機 16 核冷編譯 268 CPU 秒：tikv-jemalloc-sys 27.3s、libwebp-sys 13.7s、
      # libsqlite3-sys 9.0s 都是 C 建置，自有 crate 只佔 7.2%（依賴全熱時 clippy 只要 5.3s）。
      #
      # 判讀：改完的「第一次」run 會慢（要建立並上傳 GB 級快取），第二次才是真實水準。
      # 快取大小若沒從 76 MB 跳到 GB 級，代表這個假設也錯了。
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
          # ⚠ 這個 job **不能**跟 e2e / api-fuzz 共用 key。原本三個都寫 `workspace`，
          # 理由是省空間（各存一份是 1265 + 565 + 565 MB），但那個共用是失效的：
          #
          # rust-cache 只在「key 還不存在」時存得進去。e2e 與 api-fuzz 跑得快、先結束、
          # 先把自己的快取存進 workspace——而它們只跑 `cargo build --bin`，裡面沒有
          # clippy 的 .rmeta，也沒有 llvm-cov 的插樁產物。這個 job 最後才結束，key
          # 已存在 → 它的產物**永遠存不進去**。
          #
          # 後果是每一次 CI 都在重編：實測同一個 run 裡
          #   api-fuzz  Checking 2   Compiling 1     ← 全命中
          #   e2e       Checking 2   Compiling 1     ← 全命中
          #   本 job    Checking 297 Compiling 454   ← clippy 353 + llvm-cov 397
          # 也就是 453 個相依編兩次（clippy 一組 flag、llvm-cov 的 -C instrument-coverage
          # 又一組，artifact 本來就不能互用）。1m39 + 2m36 幾乎全是這個。
          #
          # 共用 key 只有在「產物真的一樣」時才成立。e2e 與 api-fuzz 之間成立，
          # 所以它們兩個維持共用；這個 job 拆出來自己一份。
          shared-key: workspace-lint-cov
          # 只有 main 存。GitHub 的快取是**按 ref 隔離**的，PR 分支各存一份，
          # 而 PR 本來就讀得到 base branch 的快取——自己存純粹是浪費額度。
          # 實測：Dependabot 的 4 個 PR 各存了 1.36 GB，加上 main 共 6.8 GB，
          # 把 repo 推到 10.46 / 10 GB → LRU 開始淘汰 → pnpm store 被清掉 →
          # e2e 的 `pnpm install` 從 7s 變 1m41s。省的不是空間，是別人的命中率。
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-llvm-cov,cargo-shear,typos-cli
      # 未使用／放錯區段的相依，以及沒被連進模組樹的 .rs 檔。
      # 文字掃描（找 use 路徑），所以只透過巨集展開用到的 crate 可能誤報——
      # 真遇到就進 [package.metadata.cargo-shear] ignored，不要為此關掉整個檢查。
      - name: cargo-shear（未使用的 Rust 相依）
        working-directory: .
        run: cargo shear
      # 錯字：掃程式、5 個語系的 JSON、中文註解（非 ASCII 會被跳過，中文不誤判）。
      # 白名單在 .typos.toml，只放實際被誤報過的字。
      - name: typos
        working-directory: .
        run: typos
      # 格式守門（設定見 backend/rustfmt.toml：max_width 110 + 緊湊啟發式，貼近既有風格）
      - name: cargo fmt --check
        run: cargo fmt --check
      # --locked：CI 必須測「commit 進來的那組版本」，不允許靜默更新 Cargo.lock
      - name: clippy (-D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      # 測試 + 覆蓋率一次跑完（llvm-cov 會帶 instrumentation 重編，不另外跑 nextest 免得編兩次）。
      # 用 region 而非 line 當門檻：line coverage 會被「格式化」影響——導入 rustfmt 時
      # 測試一個沒少，line 卻從 17.24% 掉到 14.14%（多行 if/else 被收成單行），
      # 而同一次 region 只從 12.44% 動到 12.45%。region 對應實際分支，不隨排版漂移。
      #
      # 門檻要跟著漲，不然做過的事就沒被鎖住。歷程：
      #   12  最初——當時 0% 的多是外部 API 整合，上游位址寫死在字串裡所以 mock 不了
      #   30  現在——`state::ExternalUrls` 讓上游可注入（wiremock 接得上），
      #       加上 admin/thoughts 的 CRUD 往返測試之後，實際來到 33.46%
      #
      # 留 3pp 餘裕：加一段還沒測到的新功能不該當場擋下，但「刪掉一批測試」會被抓到。
      # 再往上拉之前先把 watch.rs（15%）與 oauth/mailer/upload（0%）補起來。
      - name: test + coverage (llvm-cov + nextest)
        run: cargo llvm-cov nextest --locked --fail-under-regions 30
      # 契約守門：Rust struct 改了但沒重跑 export_types → 生成型別與 committed 不一致 → 擋下
      - name: specta types up-to-date
        run: |
          cargo run --locked --bin export_types
          cd ..
          git diff --exit-code packages/api-types/index.ts
      # Rust 依賴漏洞掃描（Cargo.lock 在 workspace 根；豁免清單見 .cargo/audit.toml）
      - name: cargo audit
        working-directory: .
        run: cargo audit

  # 前後端「合起來會不會動」的守門。前面兩個 job 各自都綠，卻擋不到：
  #   - 後端改了回應形狀、前端還照舊讀（這批 specta 化就改過 steam/github/wakatime 的形狀）
  #   - 值沒處理好漏到畫面上（Invalid Date、f/f/1.4、132 mmmm 三個都是手動開瀏覽器才發現的）
  #   - 該掛守衛的端點沒掛
  # 跑的是真的 stack：後端 binary（temp SQLite + seed）＋ nitro server ＋ 一層 /api 代理
  # （生產是 nginx 做這件事）。細節見 tests/e2e/stack.mjs。
  e2e:
    name: E2E · 全站煙霧 + API 契約 + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # workspace root 在根目錄（見 backend job 那段說明）
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
          # 與 api-fuzz 共用：兩個 job 都只跑 `cargo build --bin`，產物一樣，
          # 誰先存都能讓對方全命中（實測兩邊都是 Checking 2 / Compiling 1）。
          # backend job **不在**這把 key 裡——它的 clippy / llvm-cov 產物不同，
          # 硬共用的結果是它永遠存不進去、每次重編兩遍。理由寫在那個 job 底下。
          shared-key: workspace
          # 只有 main 存（理由同 backend job 那段：PR 讀得到 base 的快取，自己存是浪費額度）
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      # 瀏覽器本體進快取。key 綁 playwright 版本——升版就是新的 key，不會拿到舊 binary。
      # 命中時下面那行仍然會跑，但 playwright 偵測到 binary 已存在就只做 `--with-deps`
      # 的 apt 那段（系統函式庫沒辦法用 actions/cache 還原，那是裝進 / 的）。
      - name: playwright 瀏覽器快取
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # 只裝 chromium：三家瀏覽器各裝一次要 3 分鐘，而這裡測的是資料流不是渲染差異
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: build backend
        run: cargo build --locked --bin koimsurai-web-backend
      - name: build frontend
        run: pnpm build
      - name: playwright
        run: pnpm e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 已發布文章的 MDX 編譯守門。
  #
  # 為什麼需要：MDX 編譯失敗在前台是**靜默退回 markdown**（讀者看到裸標籤），而
  # create/update API 仍回 success。錯誤 UI 其實寫好了卻永遠不會亮——它在 render 期，
  # 而編譯已經在 blogList.ts 那層先失敗了。細節見 scripts/check-mdx.ts 的檔頭。
  #
  # 為什麼不擋 PR：文章存在 DB 裡不在 repo，PR 改的是程式碼不是內容。改成每天跑
  # 一次 + workflow_dispatch，抓的是「有人發了一篇壞掉的文章」。
  content:
    name: 內容 · 已發布文章的 MDX 編譯得過
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: MDX 編譯 + 未註冊 block 檢查
        run: pnpm check:mdx
      # 安全標頭巡檢。放在這個排程 job 而不是 e2e/PR，理由有兩個：
      #   1. 這些標頭是 nginx 加的，而 nginx 設定不在這個 repo 裡——PR 改不到它，
      #      拿它擋 PR 只會製造無關的紅燈。
      #   2. e2e 起的是 nitro + backend + 一個很小的假代理，裡面沒有 nginx；
      #      在那裡斷言只會驗到假代理，綠了也不代表線上是對的。
      # 所以它直接打正式站，每天一次。缺標頭這種事沒有任何症狀，沒人看就永遠不會發現。
      - name: 正式站安全標頭巡檢
        run: pnpm check:headers
      # 連結會在沒有人動任何程式碼的情況下爛掉（對方改網址、關站、或我們自己把頁面拿掉）。
      # 跟上面兩項一樣放這個排程 job：文章在 DB 裡不在 repo 裡，PR 改不到。
      # 只有**自家**網址壞掉才會讓這步紅——外部網站掛掉不是我們的 bug。
      - name: 已發布文章的連結巡檢
        run: pnpm check:links

  # 從 OpenAPI spec 自動生成 API 測試。跟 e2e 分開跑，因為它會對同一個 DB 打上千個
  # 請求，要自己的拋棄式 DB；而且它不需要前端，只起後端就好。
  #
  # 為什麼值得：spec 有 123 個 operation，輸入是 schemathesis 生的而不是我們想到的。
  # 第一次跑就撞出 `GET /api/films/recent?limit=abc` → 500（三支 watch 端點都中，
  # 公開免認證）。設定與已知例外見根目錄的 schemathesis.toml。
  api-fuzz:
    name: API · Schemathesis（從 OpenAPI 自動生成）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 這個 job **不裝 pnpm、也不 pnpm install**（省了 36s：action-setup 15s + install 21s）。
      # 它只需要兩件 node 的事，兩件都不用第三方套件：
      #   · tests/e2e/seed.mjs 灌種子 —— 只 import `node:sqlite`（內建，需 node 22+）
      #   · 簽一個 owner JWT     —— HS256 就是 HMAC-SHA256，`node:crypto` 八行搞定
      # setup-node 留著是因為 runner 預設的 node 版本不保證有 `node:sqlite`。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          prefix-key: v1-rust
          # 與 e2e 共用（產物相同，兩邊都只跑 `cargo build --bin`）。
          # backend job 不在這把 key 裡，理由見那個 job 底下的說明。
          shared-key: workspace
          # 只有 main 存（理由同上）
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - name: build backend
        run: cargo build --locked --bin koimsurai-web-backend
      # stack.mjs 會等前端的 .output 存在；這裡只要後端，所以直接起 binary
      - name: 起後端（temp SQLite + migrations + seed）
        run: |
          node -e "
            const { spawn } = require('node:child_process');
            const { seed } = require('./tests/e2e/seed.mjs');
            const db = '/tmp/koimsurai-fuzz.db';
            const p = spawn('./target/debug/koimsurai-web-backend', [], {
              env: { ...process.env, DATABASE_URL: 'sqlite://' + db + '?mode=rwc',
                     BIND_ADDR: '127.0.0.1:13999', JWT_SECRET: 'fuzz',
                     ADMIN_USERNAME: 'nope', ADMIN_PASSWORD: 'nope', RUST_LOG: 'warn' },
              detached: true, stdio: 'ignore' });
            p.unref();
            (async () => {
              for (let i = 0; i < 120; i++) {
                try { if ((await fetch('http://127.0.0.1:13999/api/health')).ok) break; } catch {}
                await new Promise(r => setTimeout(r, 500));
              }
              seed(db);
              console.log('後端就緒');
            })();
          "
      # 兩段跑，順序有意義：先在完整種子上掃公開面，最後才帶 token 掃 admin CRUD。
      # admin 的 DELETE 會把種子清掉，所以它必須是最後一步——沒有下一步會讀到殘局。
      - name: schemathesis（公開面，不帶認證）
        run: |
          uvx schemathesis run http://127.0.0.1:13999/api/openapi.json \
            --exclude-path-regex '^/api/admin/' \
            -w 4 --report-junit-path st.xml
      # admin 寫入端點 typed 之後 stateful 階段才推得出 create → update → delete，
      # 而串接需要認證。JWT_SECRET 與上面起後端時給的 'fuzz' 一致。
      - name: schemathesis（admin CRUD，帶 owner token）
        run: |
          TOKEN=$(node --input-type=module -e "
            // HS256 = HMAC-SHA256(base64url(header).base64url(payload))。用內建的
            // node:crypto 而不是 jsonwebtoken，這個 job 才不必 pnpm install（省 36s）。
            import { createHmac } from 'node:crypto';
            const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const head = b64({ alg: 'HS256', typ: 'JWT' });
            const body = b64({ id: 1, username: 'admin', role: 'OWNER', iat: now, exp: now + 7200 });
            const sig = createHmac('sha256', 'fuzz').update(head + '.' + body).digest('base64url');
            console.log(head + '.' + body + '.' + sig);
          ")
          uvx schemathesis run http://127.0.0.1:13999/api/openapi.json \
            --include-path-regex '^/api/admin/(tags|categories|blacklist|keyword-filters)' \
            -H "Authorization: Bearer $TOKEN" \
            -w 4 --report-junit-path st-admin.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6
        if: failure()
        with:
          name: schemathesis-report
          path: |
            st.xml
            st-admin.xml
          retention-days: 7

  # 部署路徑守門：CI 過但 docker build 炸過（js-yaml + 未釘 pnpm 那次），
  # 因為前端 job 只跑 vite build、從不碰 Dockerfile。這個 job 補上那個缺口。
  docker:
    name: Docker · frontend + backend image build
    runs-on: ubuntu-latest
    # 只有這個 job 需要寫 package（把 build cache 推上 GHCR）。
    # 全域仍是 contents: read，不要為了一個 job 把權限提到頂層。
    permissions:
      contents: read
      packages: write
    # 快取從 type=gha 換到 GHCR。要講清楚**不是**為了比較快：
    # type=gha 打的是 Azure Blob 後端的 Actions Cache 服務，GHCR 也是 GitHub/Azure
    # 側的 HTTP endpoint，兩者都走網路，換過去不多一個跳點，傳輸大約是同一個量級。
    # 真正的理由是 Actions Cache 有硬性 10 GB/repo 且會 LRU 淘汰——rust-cache 一撐大
    # 就把 docker layer 擠掉，於是冷建 546s（2026-07 實際發生過）。GHCR 沒有這個上限。
    #
    # package 的可見性繼承來源 repo：這個 repo 是 public，所以兩個 buildcache 建立時
    # 就直接是 public（實測：拿匿名 token 打 ghcr.io 的 manifest 回 200），不必手動去
    # 改設定，也不吃帳號的 Packages 儲存額度。內容只有編譯產物與已經公開的原始碼——
    # .dockerignore 擋掉 .env* 與 .git，不會把祕密烤進快取層。
    # ⚠ 哪天 repo 轉成 private，這個前提就要重新確認。
    env:
      CACHE_FE: ghcr.io/${{ github.repository }}/buildcache-frontend
      CACHE_BE: ghcr.io/${{ github.repository }}/buildcache-backend
    steps:
      # fetch-depth: 2 是給下面那個 diff 用的（要有 HEAD^ 才比得出改了什麼）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      # 只建「輸入真的變過」的那個 image。
      #
      # 我原本在這裡寫「cache mount 不會被 type=gha 匯出」——講太窄了。實情是
      # **沒有任何** buildx cache backend 會匯出 `--mount=type=cache` 的內容
      # （gha / registry / local / s3 都一樣，見 moby/buildkit#1512，2020-05 開到現在
      # 未解，維護者明確反對）。那不是 gha 的限制，是 cache mount 的設計。
      #
      # 所以 backend/Dockerfile 已改用 cargo-chef：相依的編譯產物落在真正的 image
      # layer 裡，匯得出去也復原得回來。現在 CI 上有三種結果而不是兩種——
      # 整層命中、只重編自己的程式碼（cook 層命中）、或真的冷建。
      # 即使如此，「沒必要就別觸發」仍然是最省的一手，所以這個判斷保留。
      #
      # 判不出來時（schedule / dispatch / 淺 clone）一律兩個都建——寧可多花時間，
      # 不要讓部署路徑的守門靜靜地不跑。
      - name: 判斷要建哪個 image
        id: scope
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "判不出 diff，兩個都建"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "$changed"
          # 後端 image 只吃 Cargo.* 與 backend/
          if echo "$changed" | grep -qE '^(Cargo\.(toml|lock)|backend/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          # 前端 image 的 context 是整個 repo，但 .dockerignore 擋掉的不算；
          # backend/ 以外的任何改動都可能進 COPY . . → 保守地建
          if echo "$changed" | grep -qvE '^backend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
      # fork 的 PR 拿到的 GITHUB_TOKEN 是唯讀的，登入照樣會成功（只是寫不進去），
      # 所以這步不加條件；真正防護是下面 cache-to 只在 push 時才給值。
      - name: 登入 GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # cache-to 只在 push 到 main 開：PR 不該把未合併的狀態寫進主快取，
      # 而且 fork PR 的 token 本來就寫不進去。
      # image-manifest=true + oci-mediatypes=true 是 GHCR 相容 registry 快取的必要設定。
      #
      # ⚠ 快取還不存在時 log 裡會出現一行紅字：
      #     ERROR: failed to configure registry cache importer: ...:latest: not found
      #   那是 **ERROR 字樣但不致命**——buildx 照樣往下建，job 仍然是綠的（首次啟用時
      #   實測過）。看到它不用緊張，它只代表這次沒東西可還原。
      # load: true 把建好的 image 匯進本機 daemon，trivy 才掃得到（build 完只留在
      # buildx 的快取裡，daemon 看不見）。匯出有成本，所以只在那個 image 真的重建時才做
      # ——上面的 scope 判斷已經幫我們擋掉不必要的那次。
      - name: build frontend image
        if: steps.scope.outputs.frontend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: local/web-frontend:ci
          cache-from: type=registry,ref=${{ env.CACHE_FE }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_FE) || '' }}
      - name: build backend image
        if: steps.scope.outputs.backend == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: local/web-backend:ci
          cache-from: type=registry,ref=${{ env.CACHE_BE }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE_BE) || '' }}

      # runtime image 裡 Debian / npm 那些套件的 CVE，在這之前**完全沒有東西在看**
      # ——cargo audit 只管 Cargo.lock，pnpm 那邊只管 package.json，兩者都看不到
      # base image 帶進來的 ffmpeg、libexpat、tar。
      #
      # ⚠ 門檻是 `--ignore-unfixed`，不是「任何 HIGH/CRITICAL」。實測當下：
      #     backend  138 筆 HIGH/CRITICAL，其中**只有 5 筆有修版**
      #              （其餘約 64 筆是 ffmpeg + libav*，Debian 根本還沒出修版）
      #     frontend  27 筆，其中 5 筆有修版
      #   對「沒有修版可用」的東西擋 CI，結果只會是永遠紅、然後大家學會忽略它。
      #   擋「有修版卻沒修」才是可行動的訊號。修完那 10 筆之後現在兩邊都是 0。
      - name: trivy 掃 frontend image
        if: steps.scope.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/web-frontend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: trivy 掃 backend image
        if: steps.scope.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/web-backend:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # workflow 自身的守門：actionlint 管正確性、zizmor 管安全（template injection、
  # 過寬權限、未釘 action、憑證外洩）。CI 自己也是攻擊面。
  workflows:
    name: Workflows · actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # actionlint 不在 taiki-e/install-action 的清單裡，用維護中的 wrapper action。
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: zizmor
      - name: zizmor
        run: zizmor .github/workflows/
