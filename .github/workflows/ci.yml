name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支/PR 有新 push 就取消進行中的舊 run，省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tsc + eslint + vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit
      - name: mcp-server typecheck
        run: pnpm --filter @koimsurai/mcp-server typecheck
      # --max-warnings 是 ratchet：擋住新增警告，存量分批燒掉後再往下調（404 → 398）
      - name: eslint (src)
        run: pnpm exec eslint src --max-warnings 398
      - name: vitest
        run: pnpm test
      # 真正的建置驗證——tsc/eslint 過不代表 Nitro/Vite build 不會炸
      - name: build (vite + nitro)
        run: pnpm build

  backend:
    name: Backend · clippy + test + specta drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit
      # --locked：CI 必須測「commit 進來的那組版本」，不允許靜默更新 Cargo.lock
      - name: clippy (-D warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test (nextest)
        run: cargo nextest run --locked
      # 契約守門：Rust struct 改了但沒重跑 export_types → 生成型別與 committed 不一致 → 擋下
      - name: specta types up-to-date
        run: |
          cargo run --locked --bin export_types
          cd ..
          git diff --exit-code packages/api-types/index.ts
      # Rust 依賴漏洞掃描（Cargo.lock 在 workspace 根；豁免清單見 .cargo/audit.toml）
      - name: cargo audit
        working-directory: .
        run: cargo audit

  # 部署路徑守門：CI 過但 docker build 炸過（js-yaml + 未釘 pnpm 那次），
  # 因為前端 job 只跑 vite build、從不碰 Dockerfile。這個 job 補上那個缺口。
  docker:
    name: Docker · frontend + backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
